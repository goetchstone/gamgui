[project]
name = "gamgui"
version = "0.0.1"
description = "A local, open-source macOS GUI for managing Google Workspace via GAM7 (connector-ready)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GamGUI contributors" }]
dependencies = [
    "fastapi>=0.141",       # dropped the starlette<1.0 cap, so the CVE-fixed starlette can resolve
    "starlette>=1.3.1",     # floor past the 0.52.x CVEs (Host-header URL reconstruction, multipart)
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.31",
    "keyring>=24",
]

[project.optional-dependencies]
# The native window shell. Kept optional so the core + web can be developed/tested
# without the GUI toolkit installed (e.g. in CI / headless).
desktop = [
    "pywebview==6.2.1",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff==0.16.8",         # exact: a ruff minor release can stabilize new rules and fail unchanged code
    "mypy==2.3.1",          # exact, for the same reason: a release can infer more and fail unchanged code
]

[project.scripts]
gamgui = "gamgui.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test (e.g. an asyncio subprocess deadlock seen intermittently on CI) fails with a
# traceback after 60s instead of hanging the whole job.
timeout = 60
filterwarnings = [
    # Python 3.9 GCs a finished asyncio subprocess transport after the TestClient loop closes
    # (background signature-apply jobs) -> "Exception ignored in ... RuntimeError: Event loop is closed".
    # Harmless teardown artifact; the real app's event loop is long-lived.
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
# The code's own width: 99% of lines fit in 120; the longest run to ~190.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Rule sets that catch bugs. UP and SIM are left out: they would rewrite ~570 working lines
# (typing.List -> list, contextlib.suppress) with no change in behaviour.
select = ["E", "F", "W", "B", "ASYNC", "PLE", "T10", "RUF006"]
ignore = [
    "E501",  # the ~80 lines past 120 are one-line asserts, route signatures and embedded JS; not a bug
    "E702",  # `errors.append(...); continue` guard lines are house style
]

[tool.ruff.lint.per-file-ignores]
# A one-shot CLI that blocks its own event loop while Chrome starts, before anything else runs on it.
"scripts/readme_screenshots.py" = ["ASYNC"]

[tool.mypy]
# The app's two layers; app.py is the pywebview shell (an optional extra CI's lint job doesn't install).
# Non-strict to start: unannotated function bodies are checked too, annotations aren't yet required.
files = ["gamgui/core", "gamgui/web"]
python_version = "3.10"
platform = "darwin"      # what the app runs on, also when CI checks from Linux
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Deliberately narrow: abapit is an optional connector backend, imported lazily and not installed.
# Every other dependency ships its own types, so a new untyped one fails here rather than going unchecked.
module = ["abapit", "abapit.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["gamgui"]
# Repo-root-relative paths in coverage.xml so the Dockerized Sonar scanner (which mounts the repo
# at /usr/src) can map `gamgui/...` files. Absolute paths would point outside the container.
relative_files = true
omit = [
    "gamgui/app.py",          # pywebview/window bootstrap — exercised by launching the app, not unit tests
    "gamgui/__main__.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamgui"]
