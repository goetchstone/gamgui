{#- The confirm step of a temporary password. The password isn't here: the server holds it under the token. -#}
<div class="rounded-xl border border-red-300 bg-red-50 p-4">
  <p tabindex="-1" data-focus class="text-sm font-medium text-red-800">Set a temporary password for {{ email }}?</p>
  <p class="mt-1 text-xs text-red-700">Their current password stops working, and Google asks for a new one when they next sign in.</p>
  <p class="mt-2"><code class="break-all text-xs text-red-800">{{ command }}</code></p>
  <div class="mt-3 flex gap-2">
    <button class="inline-flex items-center rounded-lg bg-red-700 px-3.5 py-2 text-sm font-medium text-white hover:bg-red-800 transition-colors"
            hx-post="/users/password/apply" hx-target="#password-zone" hx-swap="innerHTML" hx-disabled-elt="this"
            hx-vals='{"email": {{ email | tojson }}, "confirmed": "1", "preview": {{ token | tojson }} }'>Set password</button>
    <a data-cancel class="inline-flex items-center rounded-lg border border-brand-gray/60 px-3.5 py-2 text-sm text-brand-black hover:bg-paper transition-colors" href="/users/detail?email={{ email | urlencode }}#security">Cancel</a>
  </div>
</div>
