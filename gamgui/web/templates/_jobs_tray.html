{# The header's jobs tray (plan U5): the newest TRAY_ROWS jobs, running first, each linking to its own
   panel. It polls on every page, so it stays bounded (#9). A screen reader hears the running count
   change: a start from the panel it was started in ("<label>: started"), and a finish from here — each
   finished row's hidden data-announce line, which app.js speaks through #live-status unless that job's
   own panel is on the page to say it. #}
{% import "_job_live.html" as live %}
{% set rows, running, more = tray %}
<div id="jobs-list" hx-get="/jobs/status" hx-trigger="every 2s" hx-swap="outerHTML">
  {% if rows %}
  <ul class="mt-2 divide-y divide-brand-gray/30" aria-label="Recent jobs">
    {% for j in rows %}
    <li class="py-2.5">
      <div class="flex items-center gap-3">
        <a id="job-link-{{ j.id }}" href="/jobs/{{ j.id }}" class="min-w-0 truncate text-sm text-brand-black hover:underline">{{ j.title or "Background job" }}</a>
        {{ live.stop(j, "tray") }}
      </div>
      <p class="mt-0.5 line-clamp-2 text-xs {{ 'text-brand-blueink' if not j.finished else ('text-emerald-800' if not (j.error or j.interrupted or j.failed_total) else 'text-amber-800') }}"
         {% if j.finished %}{{ live.ended(j, "tray") }}{% endif %}>{{ live.job_status(j) }}</p>
      {% if j.finished %}
      <span hidden data-announce="tray-{{ j.id }}">Finished in the background: {{ j.title or "a job" }} — {{ live.job_status(j) | trim(". ") }}.</span>
      {% elif j.total %}
      <div class="mt-1.5 h-1 w-full overflow-hidden rounded bg-brand-gray/20">
        <div class="h-full bg-brand-blue" style="width: {{ j.done * 100 // j.total }}%"></div>
      </div>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
  {% if more %}<p class="mt-1 text-xs text-brand-grayink">+{{ more }} older not listed.</p>{% endif %}
  {% else %}
  <p class="mt-2 text-sm text-brand-grayink">Nothing has run in the background since GamGUI started.</p>
  {% endif %}
  {% if oob %}{{ live.jobs_count(running, oob=True) }}{% endif %}
</div>
