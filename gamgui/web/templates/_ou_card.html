{#- A person's org unit (roadmap 4.2): the tree read live, a move previewed before it runs. -#}
{% if error %}
<p class="text-sm text-amber-800">{{ error }}</p>
{% else %}
<form id="ou-form" class="space-y-2" hx-post="/users/ou/preview" hx-target="#ou-confirm" hx-swap="innerHTML" hx-disabled-elt="find button">
  <input type="hidden" name="email" value="{{ email }}" />
  <label class="block text-sm text-brand-blueink">Move to
    <select name="org_unit" class="mt-1 block w-full rounded-lg border border-brand-field bg-brand-white px-3 py-2 text-sm focus:border-brand-blue focus:outline-none focus:ring-2 focus:ring-brand-blue/30">
      {% for p in paths %}<option value="{{ p }}"{% if p == current %} selected{% endif %}>{{ p }}{% if p == current %} (now){% endif %}</option>{% endfor %}
    </select>
  </label>
  {% if paths | length == 1 %}<p class="text-xs text-brand-grayink">This domain has no org units below the root yet: create one in the Admin console or the Builder.</p>{% endif %}
  <button type="submit" class="inline-flex items-center rounded-lg border border-brand-blue/40 px-3 py-1.5 text-xs font-medium text-brand-blueink hover:bg-paper transition-colors">Preview the move</button>
</form>
<div id="ou-confirm" class="mt-2"></div>
{% endif %}
