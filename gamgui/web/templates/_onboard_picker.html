{% if error %}
<p class="mt-1 text-xs text-amber-700">{{ error }}</p>
{% elif items %}
<ul class="mt-1 max-h-44 overflow-y-auto rounded-lg border border-brand-gray/30 divide-y divide-brand-gray/20 bg-brand-white text-sm shadow-sm">
  {% for it in items %}
  <li>
    <button type="button" data-action="ob-add" data-field="{{ field }}" data-value="{{ it.value }}"
            class="block w-full px-2.5 py-1.5 text-left hover:bg-brand-blue/10">
      <div class="truncate text-brand-black">{{ it.label }}</div>
      {% if it.sub %}<div class="truncate font-mono text-[11px] text-brand-grayink">{{ it.sub }}</div>{% endif %}
    </button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="mt-1 text-xs text-brand-grayink">No matches.</p>
{% endif %}
{% if as_of is defined and not error %}
<p class="mt-1 text-[11px] text-brand-grayink">Groups {% include "_as_of.html" %} ·
  <button type="button" title="Reload from Google" class="underline hover:text-brand-black"
          hx-get="/onboard/search/groups?refresh=1&amp;q={{ q | default('') | urlencode }}"
          hx-target="#ob-group-picker" hx-swap="innerHTML">Refresh</button></p>
{% endif %}
