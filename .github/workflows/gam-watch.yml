name: GAM release watch

# Weekly: if GAM-team/GAM shipped a version newer than our pin, do the mechanical part of the
# "Updating GAM" runbook and open a PR — verified, tested, ready to review. Not auto-merge: a human
# still reads the changelog, runs scripts/acceptance.py against a real tenant, and merges. The PR's
# own required checks (CI across 3.10/3.12/3.14 + CodeQL) are the gate; the contract test turns a
# renamed/removed command into a red PR rather than a silent live break.
#
# The pin is written automatically ONLY because scripts/bump_gam.py verifies GitHub's Sigstore build
# attestation for the asset first (gh attestation verify, signed by GAM-team/GAM's build.yml on main,
# on a GitHub-hosted runner). No verified provenance -> the script fails -> no PR. That is what keeps
# automatic pinning from being trust-on-first-use (see the fail-closed pin invariant in CLAUDE.md).
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bump:
    # macOS arm64, so the vendored asset (and its pinned checksum) is exactly what a maintainer's
    # `make gam` produces — not a Linux runner's different asset.
    runs-on: macos-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is a newer GAM out?  # cheap check first — no download unless we're actually behind
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN=$(python3 -c "import re,pathlib;print(re.search(r'TAG=\"v([0-9.]+)\"',pathlib.Path('scripts/fetch_gam.sh').read_text()).group(1))")
          LATEST=$(gh api repos/GAM-team/GAM/releases/latest --jq .tag_name | sed 's/^v//')
          # The tag is upstream-controlled and flows into later steps, so admit only a bare
          # version number — never shell metacharacters or a newline that could forge an output.
          VERSION_RE='^[0-9]+(\.[0-9]+){2,3}$'  # bash =~ anchors the whole string, newlines included
          if ! [[ "$LATEST" =~ $VERSION_RE ]]; then
            echo "Refusing unexpected release tag: $(printf '%q' "$LATEST")"; exit 1
          fi
          echo "pinned=$PIN latest=$LATEST"
          if [ "$PIN" = "$LATEST" ]; then echo "todo=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh pr list --state open --search "in:title GAM $LATEST" | grep -q "GAM $LATEST"; then
            echo "PR for $LATEST already open."; echo "todo=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "todo=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.todo == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the locked dev dependencies (for the catalog regen + tests)
        if: steps.check.outputs.todo == 'true'
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt

      - name: Bump — attest, pin, vendor, regenerate
        if: steps.check.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
        # Never expand an expression inside run: — pass it through env so the shell sees data.
        run: python scripts/bump_gam.py "v$LATEST"

      - name: Run the suite (drift guards included)
        if: steps.check.outputs.todo == 'true'
        id: tests
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          tail -20 /tmp/pytest.log

      - name: Open the PR
        if: steps.check.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          PIN: ${{ steps.check.outputs.pin }}
          TESTS_RC: ${{ steps.tests.outputs.rc }}
        run: |
          BR="gam-bump/$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          DELTA=$(awk -v pin="$PIN" 'index($0,pin){exit} {print}' gamgui/resources/gam7/GamUpdate.txt | head -40)
          STATUS=$([ "$TESTS_RC" = "0" ] && echo "✅ offline suite green" || echo "❌ offline suite RED — needs code changes before merge")
          git commit -q -m "GAM: bump $PIN -> $LATEST (automated)

          Asset attested (gh attestation verify, GAM-team/GAM build.yml on main), pinned, vendored, catalog
          regenerated, mock + doc counts refreshed by scripts/bump_gam.py. $STATUS"
          git push -u origin "$BR"
          gh pr create --title "GAM $LATEST (automated bump)" --head "$BR" --body \
          "Automated bump of the vendored GAM, **$PIN → $LATEST**, via \`scripts/bump_gam.py\`.

          - Asset **build-attestation verified** (signed by \`GAM-team/GAM\`'s release workflow on \`main\`) before the pin was written.
          - Pin, version strings, test mock, browse catalog and the counts in CLAUDE.md, README and ROADMAP updated mechanically.
          - $STATUS

          **Before merge (human):** skim the changelog below, and run \`scripts/acceptance.py\` against a
          real tenant — CI cannot (it is the only true output-shape check). If the suite is red, the
          contract test likely caught a renamed/removed command we use; that needs a code change.

          <details><summary>GamUpdate.txt since $PIN</summary>

          \`\`\`
          $DELTA
          \`\`\`
          </details>"
