name: GAM release watch

# Weekly: if GAM-team/GAM shipped a version newer than our pin, do the mechanical part of the
# "Updating GAM" runbook and open a PR — verified, tested, ready to review. Not auto-merge: a human
# still reads the changelog, runs scripts/acceptance.py against a real tenant, and merges. The PR's
# required checks (branch protection on main: ci-ok, CodeQL, dependency review) are the gate; the
# contract test turns a renamed/removed command into a red PR rather than a silent live break. A PR
# opened with github.token doesn't start CI by itself: its runs wait as "action required" until the
# maintainer clicks "Approve and run workflows" on it — merge only once they're green (PR #22 was
# merged 5 s after its approved runs began, before any finished).
#
# The pin is written automatically ONLY because scripts/bump_gam.py verifies GitHub's Sigstore build
# attestation for the asset first (gh attestation verify, signed by GAM-team/GAM's build.yml on main,
# on a GitHub-hosted runner). No verified provenance -> the script fails -> no PR. That is what keeps
# automatic pinning from being trust-on-first-use (see the fail-closed pin invariant in CLAUDE.md).
#
# Two jobs, so the token that can push never meets the new code: `prepare` downloads the new GAM,
# installs the locked deps and runs the suite with a read-only token, and hands the result on as a
# patch; `open-pr` only applies that patch, pushes the branch and opens the PR.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    # macOS arm64, so the vendored asset (and its pinned checksum) is exactly what a maintainer's
    # `make gam` produces — not a Linux runner's different asset.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read    # gh pr list: is a PR for this version already open?
    outputs:
      todo: ${{ steps.check.outputs.todo }}
      latest: ${{ steps.check.outputs.latest }}
      pin: ${{ steps.check.outputs.pin }}
      tests_rc: ${{ steps.tests.outputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is a newer GAM out?  # cheap check first — no download unless we're actually behind
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN=$(python3 -c "import re,pathlib;print(re.search(r'TAG=\"v([0-9.]+)\"',pathlib.Path('scripts/fetch_gam.sh').read_text()).group(1))")
          LATEST=$(gh api repos/GAM-team/GAM/releases/latest --jq .tag_name | sed 's/^v//')
          # The tag is upstream-controlled and flows into later steps, so admit only a bare
          # version number — never shell metacharacters or a newline that could forge an output.
          VERSION_RE='^[0-9]+(\.[0-9]+){2,3}$'  # bash =~ anchors the whole string, newlines included
          if ! [[ "$LATEST" =~ $VERSION_RE ]]; then
            echo "Refusing unexpected release tag: $(printf '%q' "$LATEST")"; exit 1
          fi
          echo "pinned=$PIN latest=$LATEST"
          if [ "$PIN" = "$LATEST" ]; then echo "todo=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh pr list --state open --search "in:title GAM $LATEST" | grep -q "GAM $LATEST"; then
            echo "PR for $LATEST already open."; echo "todo=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "todo=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.todo == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the locked dev dependencies (for the catalog regen + tests)
        if: steps.check.outputs.todo == 'true'
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt

      - name: Bump — attest, pin, vendor, regenerate
        if: steps.check.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
        # Never expand an expression inside run: — pass it through env so the shell sees data.
        run: python scripts/bump_gam.py "v$LATEST"

      - name: Run the suite (drift guards included)
        if: steps.check.outputs.todo == 'true'
        id: tests
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          tail -20 /tmp/pytest.log

      - name: Package the bump for the job that opens the PR
        if: steps.check.outputs.todo == 'true'
        env:
          PIN: ${{ steps.check.outputs.pin }}
        # GamUpdate.txt is vendored (gitignored), so the changelog excerpt for the PR body is cut here.
        run: |
          mkdir -p "$RUNNER_TEMP/bump"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/bump/bump.patch"
          awk -v pin="$PIN" 'index($0,pin){exit} {print}' gamgui/resources/gam7/GamUpdate.txt | head -40 > "$RUNNER_TEMP/bump/delta.txt"
          test -s "$RUNNER_TEMP/bump/bump.patch"

      - if: steps.check.outputs.todo == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gam-bump
          path: ${{ runner.temp }}/bump
          retention-days: 5

  open-pr:
    needs: prepare
    if: needs.prepare.outputs.todo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gam-bump
          path: ${{ runner.temp }}/bump

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          PIN: ${{ needs.prepare.outputs.pin }}
          TESTS_RC: ${{ needs.prepare.outputs.tests_rc }}
        run: |
          BR="gam-bump/$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git apply --index "$RUNNER_TEMP/bump/bump.patch"
          DELTA=$(cat "$RUNNER_TEMP/bump/delta.txt")
          STATUS=$([ "$TESTS_RC" = "0" ] && echo "✅ offline suite green" || echo "❌ offline suite RED — needs code changes before merge")
          git commit -q -m "GAM: bump $PIN -> $LATEST (automated)

          Asset attested (gh attestation verify, GAM-team/GAM build.yml on main), pinned, vendored, catalog
          regenerated, mock + doc counts refreshed by scripts/bump_gam.py. $STATUS"
          git push -u origin "$BR"
          gh pr create --title "GAM $LATEST (automated bump)" --head "$BR" --body \
          "Automated bump of the vendored GAM, **$PIN → $LATEST**, via \`scripts/bump_gam.py\`.

          - Asset **build-attestation verified** (signed by \`GAM-team/GAM\`'s release workflow on \`main\`) before the pin was written.
          - Pin, version strings, test mock, browse catalog and the counts in CLAUDE.md, README and ROADMAP updated mechanically.
          - $STATUS

          **Before merge (human):** click **Approve and run workflows** so CI and CodeQL run on this PR
          (a PR opened by github.token doesn't start them), and merge only once the required checks are
          green. Skim the changelog below, and run \`scripts/acceptance.py\` against a real tenant — CI
          cannot (it is the only true output-shape check). If the suite is red, the contract test likely
          caught a renamed/removed command we use; that needs a code change.

          <details><summary>GamUpdate.txt since $PIN</summary>

          \`\`\`
          $DELTA
          \`\`\`
          </details>"
