name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only checks out, installs, vendors the GAM binary and runs pytest, ruff, mypy or the
# app.css check, or builds and checks the .app — nothing writes back to the repo, so read-only
# content access is all GITHUB_TOKEN needs (it is also what the fetch_gam.sh api.github.com calls
# authenticate with, purely to dodge the anonymous 60/hr limit).
permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only; ruff and mypy are exact pins in the lock)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Mypy (scope and settings in pyproject's [tool.mypy])
        run: mypy
      - name: app.css is what the pinned Tailwind CLI builds from the templates (checksum-verified, fails closed)
        run: ./scripts/build_css.sh --check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    timeout-minutes: 15   # a hung test fails the job fast instead of burning the 6h default
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install (hash-locked, wheels only; one universal lock serves every OS and Python here)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt

      - name: Run tests
        # Uses the mock gam binary; needs no vendored GAM7 and no credentials.
        if: ${{ !(matrix.os == 'macos-latest' && matrix.python == '3.14') }}
        run: pytest -q

      - name: Run tests with the coverage gate (fail_under in pyproject's [tool.coverage.report])
        # One leg only: Linux skips the macOS filesystem tests (case, NFD, the data-volume firmlink), so
        # its total differs. This leg is where the floor was measured: a clean clone, no vendored GAM.
        if: matrix.os == 'macos-latest' && matrix.python == '3.14'
        run: pytest -q --cov --cov-report=term

  a11y:
    # tests/test_a11y.py: axe-core over every main screen of the mock-backed app in headless Chrome,
    # its serious/critical violations held to tests/a11y/baseline.json. macos-latest ships Google
    # Chrome; A11Y_REQUIRE_CHROME fails the job, rather than skipping the test, if it ever doesn't.
    name: a11y (axe-core ratchet)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: No new or grown serious/critical axe violation (the summary prints on success too)
        run: pytest -q -m a11y -rP
        env:
          A11Y_REQUIRE_CHROME: "1"

  gam-compat:
    name: gam-compat (pinned binary)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"   # the vendored gam's own Python: test_gam_exit_codes unmarshals its bytecode
      - name: Install (hash-locked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Vendor the pinned GAM7 binary + command reference
        run: ./scripts/fetch_gam.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authenticate api.github.com -> avoid the 60/hr 403
      - name: Assert the vendored version matches the pin
        run: |
          python - <<'PY'
          import pathlib
          from gamgui.core.gam.commands import EXPECTED_GAM_VERSION
          v = pathlib.Path("gamgui/resources/gam7/VERSION").read_text()
          assert EXPECTED_GAM_VERSION in v, f"vendored VERSION {v!r} != pin {EXPECTED_GAM_VERSION}"
          print("vendored:", v.split(chr(10))[0])
          PY
      - name: Restore the committed command catalog (fetch_gam.sh replaces resources/gam7 wholesale)
        run: git checkout -- gamgui/resources/gam7/command_catalog.json
      - name: The whole suite against the REAL reference (the command contract, and every argv sent to the mock)
        run: pytest -q
        env:
          # tests/test_gam_exit_codes.py reads the build's *_RC table here; a skip would hide that it didn't.
          EXIT_CODES_REQUIRE_GAM: "1"

  app:
    # Freezes the .app exactly as `make app` does, so a spec, lock or signing change that breaks the
    # bundle fails here rather than at the next local build. The runner has no signing identity, so
    # build_app.sh signs ad-hoc (hardened runtime). The pinned gam's libpython needs macOS >= 26.5.
    name: app (build + smoke check)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Vendor the pinned GAM7 binary (what make gam runs)
        run: ./scripts/fetch_gam.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authenticate api.github.com -> avoid the 60/hr 403
      - name: Restore the committed command catalog (fetch_gam.sh replaces resources/gam7 wholesale)
        run: git checkout -- gamgui/resources/gam7/command_catalog.json
      - name: Build dist/GamGUI.app (a fresh venv from requirements/app.txt)
        run: ./scripts/build_app.sh
        env:
          PYTHON: python
      - name: Smoke-check the bundle (executable, signature, frozen modules, data files, gam version)
        run: build/venv/bin/python scripts/check_app.py dist/GamGUI.app

  fuzz:
    # Coverage-guided fuzzing (Atheris, fuzz/fuzz_props.py) of the property tests in tests/test_props_*.py:
    # the invariants the suite checks with fixed examples, steered by coverage toward inputs nobody wrote.
    # A fixed seed, run count and hash seed make it reproducible, so a red job is a real crash that a
    # re-run finds again — never noise. Linux: Atheris ships wheels only for Linux x86_64 CPython 3.12+
    # (requirements/dev.in's marker installs it here and nowhere else).
    name: fuzz (atheris)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only; the lock's marker brings Atheris on this runner)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Fuzz every property (fixed seed and run count; a crash's input is kept below)
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz"
          python fuzz/fuzz_props.py -seed=1 -runs=300000 -max_len=4096 -print_final_stats=1 \
            -artifact_prefix="$RUNNER_TEMP/fuzz/"
        env:
          PYTHONPATH: "."
          PYTHONHASHSEED: "0"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash
          path: ${{ runner.temp }}/fuzz
          retention-days: 14

  gam-latest-preview:
    # Non-blocking early warning: would the NEWEST GAM rename/remove a command we use? Does not change the pin.
    name: gam-compat (latest, non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Vendor the LATEST GAM7 (preview only)
        # --allow-unpinned: a newer-than-pinned asset has no committed checksum by definition. Safe
        # only because this job is a throwaway preview — never add it to the gam-compat job above.
        run: ./scripts/fetch_gam.sh --tag latest --allow-unpinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authenticate api.github.com -> avoid the 60/hr 403
      - name: Command-token contract against latest (early warning)
        run: pytest -q tests/test_command_contract.py -k "tokens or grammar_line"

  ci-ok:
    # The one check from this workflow that branch protection requires (with CodeQL's Analyze legs and
    # Dependency review). Required checks are matched by name, so requiring the matrix legs one by one
    # would wedge every PR the day a leg is renamed or a Python version changes — a required name that
    # never reports never passes. `needs` is every job above except the non-blocking preview
    # (tests/test_workflow_safety.py holds that), and a skipped or cancelled job fails this as surely
    # as a failed one: a required check passes on "skipped".
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, a11y, gam-compat, app, fuzz]
    if: always()
    steps:
      - name: Every blocking job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A blocking CI job did not pass; its own check says which."
          exit 1
