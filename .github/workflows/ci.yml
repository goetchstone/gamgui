name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only checks out, installs, vendors the GAM binary and runs pytest, ruff or mypy, or
# builds and checks the .app — nothing writes back to the repo, so read-only content access is all
# GITHUB_TOKEN needs (it is also what the fetch_gam.sh api.github.com calls authenticate with, purely
# to dodge the anonymous 60/hr limit).
permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only; ruff and mypy are exact pins in the lock)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Mypy (scope and settings in pyproject's [tool.mypy])
        run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    timeout-minutes: 15   # a hung test fails the job fast instead of burning the 6h default
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install (hash-locked, wheels only; one universal lock serves every OS and Python here)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt

      - name: Run tests
        # Uses the mock gam binary; needs no vendored GAM7 and no credentials.
        if: ${{ !(matrix.os == 'macos-latest' && matrix.python == '3.14') }}
        run: pytest -q

      - name: Run tests with the coverage gate (fail_under in pyproject's [tool.coverage.report])
        # One leg only: Linux skips the macOS filesystem tests (case, NFD, the data-volume firmlink), so
        # its total differs. This leg is where the floor was measured: a clean clone, no vendored GAM.
        if: matrix.os == 'macos-latest' && matrix.python == '3.14'
        run: pytest -q --cov --cov-report=term

  gam-compat:
    name: gam-compat (pinned binary)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Vendor the pinned GAM7 binary + command reference
        run: ./scripts/fetch_gam.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authenticate api.github.com -> avoid the 60/hr 403
      - name: Assert the vendored version matches the pin
        run: |
          python - <<'PY'
          import pathlib
          from gamgui.core.gam.commands import EXPECTED_GAM_VERSION
          v = pathlib.Path("gamgui/resources/gam7/VERSION").read_text()
          assert EXPECTED_GAM_VERSION in v, f"vendored VERSION {v!r} != pin {EXPECTED_GAM_VERSION}"
          print("vendored:", v.split(chr(10))[0])
          PY
      - name: Restore the committed command catalog (fetch_gam.sh replaces resources/gam7 wholesale)
        run: git checkout -- gamgui/resources/gam7/command_catalog.json
      - name: The whole suite against the REAL reference (the command contract, and every argv sent to the mock)
        run: pytest -q

  app:
    # Freezes the .app exactly as `make app` does, so a spec, lock or signing change that breaks the
    # bundle fails here rather than at the next local build. The runner has no signing identity, so
    # build_app.sh signs ad-hoc (hardened runtime). The pinned gam's libpython needs macOS >= 26.5.
    name: app (build + smoke check)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Vendor the pinned GAM7 binary (what make gam runs)
        run: ./scripts/fetch_gam.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authenticate api.github.com -> avoid the 60/hr 403
      - name: Restore the committed command catalog (fetch_gam.sh replaces resources/gam7 wholesale)
        run: git checkout -- gamgui/resources/gam7/command_catalog.json
      - name: Build dist/GamGUI.app (a fresh venv from requirements/app.txt)
        run: ./scripts/build_app.sh
        env:
          PYTHON: python
      - name: Smoke-check the bundle (executable, signature, frozen modules, data files, gam version)
        run: build/venv/bin/python scripts/check_app.py dist/GamGUI.app

  gam-latest-preview:
    # Non-blocking early warning: would the NEWEST GAM rename/remove a command we use? Does not change the pin.
    name: gam-compat (latest, non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install (hash-locked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
      - name: Vendor the LATEST GAM7 (preview only)
        # --allow-unpinned: a newer-than-pinned asset has no committed checksum by definition. Safe
        # only because this job is a throwaway preview — never add it to the gam-compat job above.
        run: ./scripts/fetch_gam.sh --tag latest --allow-unpinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # authenticate api.github.com -> avoid the 60/hr 403
      - name: Command-token contract against latest (early warning)
        run: pytest -q tests/test_command_contract.py -k "tokens or grammar_line"
